services:
  userbot:
    container_name: UserLixo
    build: .
    
    # Reinicia automaticamente se o bot cair ou o host for reiniciado
    restart: always

    # Permite a interação terminal necessária para o login inicial do Telegram
    stdin_open: true
    tty: true

    volumes:
      # 1. VOLUME DE PERSISTÊNCIA (Dados do Bot)
      # O ponto (.) no host (onde estão os arquivos do bot) é mapeado para /app.
      # Isso garante que o código, as sessions e o DB sejam lidos/escritos de forma persistente.
      - .:/app

      # 2. ACESSO AMPLO AO SISTEMA DO HOST (Variável .env)
      # O caminho no host é injetado pela variável HOST_HOME_PATH (lida do .env).
      # Se a variável não for definida (fallback), ele tenta usar a variável padrão $HOME do shell.
      - ${HOST_HOME_PATH:-$HOME}:/host_access
